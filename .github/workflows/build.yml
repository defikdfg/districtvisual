name: Build DistrictVisual
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Download Gradle wrapper jar
      run: |
        mkdir -p gradle/wrapper
        curl -sL -o gradle/wrapper/gradle-wrapper.jar \
          "https://github.com/gradle/gradle/raw/v8.8.0/gradle/wrapper/gradle-wrapper.jar"
    - run: chmod +x gradlew
    - run: ./gradlew build --no-daemon
    - uses: actions/upload-artifact@v4
      with:
        name: districtvisual-jar
        path: build/libs/districtvisual-*.jar
